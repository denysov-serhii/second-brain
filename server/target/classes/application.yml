server:
  port: ${PORT:8080}

spring:
  application:
    name: second-brain-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/second_brain}
    username: ${DB_USERNAME:second_brain}
    password: ${DB_PASSWORD:second_brain}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
      embedding:
        options:
          model: text-embedding-3-small
      audio:
        transcription:
          options:
            model: whisper-1

management:
  endpoints:
    web:
      exposure:
        include: health,info
