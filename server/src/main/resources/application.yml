server:
  port: ${PORT:8080}

spring:
  application:
    name: second-brain-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/second_brain}
    username: ${DB_USERNAME:second_brain}
    password: ${DB_PASSWORD:second_brain}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
