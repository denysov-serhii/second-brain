name: Build and Deploy Native Backend

on:
  # Trigger automated delivery on direct updates to main.
  push:
    branches:
      - main

jobs:
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout repository sources.
      - name: Checkout
        uses: actions/checkout@v4

      # Install GraalVM JDK 25 and cache Maven dependencies.
      - name: Set up GraalVM 25
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: maven

      # Build native executable for Linux x64.
      - name: Build native binary
        run: mvn -f server/pom.xml -B -ntp -DskipTests native:compile-no-fork

      # Publish the binary as an artifact for the deploy job.
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-native
          path: server/target/second-brain-server
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build-native
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      # Download the binary produced by build-native.
      - name: Download native artifact
        uses: actions/download-artifact@v4
        with:
          name: second-brain-native
          path: ./artifact

      # Configure SSH credentials from GitHub Secrets.
      - name: Configure SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      # Copy binary to the remote server over SCP.
      - name: Copy binary to server
        run: |
          scp -P "${{ secrets.DEPLOY_PORT }}" \
            ./artifact/second-brain-server \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/second-brain-server"

      # Promote binary in place and restart the backend service remotely.
      - name: Restart remote service
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -euo pipefail
          sudo install -m 755 /tmp/second-brain-server "${{ secrets.DEPLOY_APP_PATH }}"
          sudo systemctl restart "${{ secrets.DEPLOY_SERVICE_NAME }}"
          sudo systemctl --no-pager --full status "${{ secrets.DEPLOY_SERVICE_NAME }}"
          EOF
